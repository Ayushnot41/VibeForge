    <text x="16" y="215" fill="#94a3b8" font-size="10">  ElevenLabs studio audio</text>

    <rect x="16" y="270" width="163" height="50" rx="8" fill="rgba(16, 185, 129, 0.15)" stroke="#10b981" />
    <text x="97" y="292" fill="#6ee7b7" font-size="10" font-weight="700" text-anchor="middle">Ready for Display</text>
    <text x="97" y="308" fill="#94a3b8" font-size="9" text-anchor="middle">Saved in PostgreSQL</text>
  </g>

  <!-- Step 5: Dual ML -->
  <g transform="translate(955, 110)">
    <rect width="185" height="340" rx="16" fill="rgba(255,255,255,0.03)" stroke="rgba(6, 182, 212, 0.4)" filter="url(#shadow)" />
    <rect x="16" y="16" width="40" height="40" rx="10" fill="rgba(6, 182, 212, 0.2)" />
    <text x="36" y="42" fill="#67e8f9" font-size="18" text-anchor="middle">🤖</text>
    <text x="68" y="34" fill="#22d3ee" font-size="11" font-weight="800">STEP 5</text>
    <text x="68" y="48" fill="#ffffff" font-size="13" font-weight="700">Dual ML Engine</text>

    <line x1="16" y1="70" x2="169" y2="70" stroke="rgba(255,255,255,0.08)" />

    <text x="16" y="95" fill="#38bdf8" font-size="10" font-weight="700">1. Reality Check Model</text>
    <text x="16" y="110" fill="#94a3b8" font-size="9">   NLP LogReg (95% Acc)</text>
    <text x="16" y="125" fill="#94a3b8" font-size="9">   Maps goal → 6 domains</text>

    <text x="16" y="155" fill="#34d399" font-size="10" font-weight="700">2. Success Forecaster</text>
    <text x="16" y="170" fill="#94a3b8" font-size="9">   Random Forest (80% Acc)</text>
    <text x="16" y="185" fill="#94a3b8" font-size="9">   Tracks completion velocity</text>

    <rect x="16" y="270" width="153" height="50" rx="8" fill="rgba(6, 182, 212, 0.15)" stroke="#06b6d4" />
    <text x="92" y="292" fill="#67e8f9" font-size="10" font-weight="700" text-anchor="middle">Live Inferences</text>
    <text x="92" y="308" fill="#94a3b8" font-size="9" text-anchor="middle">FastAPI on Port 8000</text>
  </g>

  <!-- Connectors -->
  <path d="M 255 280 L 280 280" stroke="#7c3aed" stroke-width="2" />
  <path d="M 475 280 L 500 280" stroke="#3b82f6" stroke-width="2" />
  <path d="M 710 280 L 735 280" stroke="#f59e0b" stroke-width="2" />
  <path d="M 930 280 L 955 280" stroke="#10b981" stroke-width="2" />

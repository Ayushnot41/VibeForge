    <text x="16" y="95" fill="#34d399" font-size="11" font-weight="700">1. Optimistic Path (10x)</text>
    <text x="16" y="112" fill="#94a3b8" font-size="10">  Max upside, all bets hit</text>

    <text x="16" y="135" fill="#60a5fa" font-size="11" font-weight="700">2. Realistic Path (Base)</text>

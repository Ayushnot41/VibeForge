    <text x="0" y="52" fill="#94a3b8" font-size="13">End-to-end ingestion, parallel reality synthesis, obstacle feedback loop, and predictive telemetry</text>
  </g>

  <!-- Step 1 -->
  <g transform="translate(60, 110)">
    <rect width="195" height="340" rx="16" fill="rgba(255,255,255,0.03)" stroke="rgba(124, 58, 237, 0.4)" filter="url(#shadow)" />
    <rect x="16" y="16" width="40" height="40" rx="10" fill="rgba(124, 58, 237, 0.2)" />
    <text x="36" y="42" fill="#c4b5fd" font-size="18" text-anchor="middle">🎯</text>
    <text x="68" y="34" fill="#a78bfa" font-size="11" font-weight="800">STEP 1</text>
    <text x="68" y="48" fill="#ffffff" font-size="13" font-weight="700">Goal Ingestion</text>

    <line x1="16" y1="70" x2="179" y2="70" stroke="rgba(255,255,255,0.08)" />

    <text x="16" y="95" fill="#cbd5e1" font-size="11" font-weight="600">• User Goal &amp; Ambition</text>
    <text x="16" y="115" fill="#94a3b8" font-size="10">  Free-text life aspiration</text>

    <text x="16" y="145" fill="#cbd5e1" font-size="11" font-weight="600">• Current Situation</text>
    <text x="16" y="165" fill="#94a3b8" font-size="10">  Skills, blockers, baseline</text>

    <text x="16" y="195" fill="#cbd5e1" font-size="11" font-weight="600">• Time Horizon</text>
    <text x="16" y="215" fill="#94a3b8" font-size="10">  3, 6, 12 or 24 months</text>

    <rect x="16" y="270" width="163" height="50" rx="8" fill="rgba(124, 58, 237, 0.15)" stroke="#7c3aed" />
    <text x="97" y="292" fill="#c4b5fd" font-size="10" font-weight="700" text-anchor="middle">⚡ Dual Dispatch</text>
    <text x="97" y="308" fill="#94a3b8" font-size="9" text-anchor="middle">LangGraph + ML Classifier</text>
  </g>

  <!-- Step 2 -->
  <g transform="translate(280, 110)">

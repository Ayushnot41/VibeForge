    <text x="105" y="274" fill="#fbbf24" font-size="9" text-anchor="middle">Auto-revises path milestones</text>
    <text x="105" y="290" fill="#94a3b8" font-size="8" text-anchor="middle">(Up to 3 cognitive cycles)</text>
